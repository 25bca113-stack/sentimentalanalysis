<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis Chatbot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 600px;
            background-color: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .chat-header {
            background-color: #0f172a;
            padding: 18px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .status-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
        }

        .chat-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            align-self: flex-start;
            background-color: #334155;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }

        .sentiment-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .badge-positive { background-color: #166534; color: #4ade80; }
        .badge-negative { background-color: #991b1b; color: #fca5a5; }
        .badge-neutral  { background-color: #854d0e; color: #fef08a; }

        .score-text {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 4px;
        }

        .chat-input-area {
            padding: 16px;
            background-color: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #2563eb;
        }

        .chat-input-area button {
            padding: 12px 20px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-input-area button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="status-dot"></div>
            <h2>Sentiment NLP Chatbot</h2>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                Hello! Type any sentence below and I will analyze its sentiment in real-time.
            </div>
        </div>

        <form class="chat-input-area" id="chatForm">
            <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');

        // Client-side sentiment analyzer rule engine
        function analyzeSentiment(text) {
            const posWords = ['good', 'great', 'awesome', 'amazing', 'happy', 'love', 'excellent', 'fantastic', 'nice', 'best'];
            const negWords = ['bad', 'terrible', 'horrible', 'sad', 'hate', 'worst', 'angry', 'annoying', 'poor', 'fail'];

            const words = text.toLowerCase().match(/\b\w+\b/g) || [];
            let score = 0;

            words.forEach(word => {
                if (posWords.includes(word)) score += 0.3;
                if (negWords.includes(word)) score -= 0.3;
            });

            // Clamp score between -1 and 1
            score = Math.max(-1, Math.min(1, score));

            if (score >= 0.1) {
                return { sentiment: 'POSITIVE', badgeClass: 'badge-positive', score: score.toFixed(2), reply: "I'm glad to hear that! Keep up the good energy." };
            } else if (score <= -0.1) {
                return { sentiment: 'NEGATIVE', badgeClass: 'badge-negative', score: score.toFixed(2), reply: "I'm sorry to hear that. Hope things get better soon." };
            } else {
                return { sentiment: 'NEUTRAL', badgeClass: 'badge-neutral', score: (0).toFixed(2), reply: "Got it! That sounds pretty balanced." };
            }
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Display user message
            appendMessage(message, 'user');
            userInput.value = '';

            // Process sentiment & respond
            setTimeout(() => {
                const result = analyzeSentiment(message);
                appendBotMessage(result);
            }, 300);
        });

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendBotMessage(result) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', 'bot');
            
            msgDiv.innerHTML = `
                <div class="sentiment-badge ${result.badgeClass}">${result.sentiment}</div>
                <div>${result.reply}</div>
                <div class="score-text">Polarity Score: ${result.score}</div>
            `;
            
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
